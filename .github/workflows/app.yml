# Gera o APK do app e publica em Releases (link fixo: .../releases/download/app-latest/Saude.apk).
name: App Android (APK)

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Android SDK 37 (exigido pelo pacote health)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: Chave de assinatura do APK (secret APK_KEYSTORE_BASE64)
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo "$APK_KEYSTORE_BASE64" | base64 -d > android/app/saude.jks
          else
            echo "::warning::Sem o secret APK_KEYSTORE_BASE64: o APK sai com chave temporária e, para atualizar, será preciso desinstalar o anterior."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Gerar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Guardar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: Saude-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Saude.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest Saude.apk \
            --title "App Saúde — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente do commit ${{ github.sha }}. Baixe o Saude.apk abaixo e instale por cima da versão anterior (os dados ficam)." \
            --target "${{ github.sha }}" \
            --latest
